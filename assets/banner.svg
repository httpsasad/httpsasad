<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Muhammad Asad Akram, AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <!-- soft card shadow behind the banner -->
    <filter id="cardShadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <!-- text shadow -->
    <filter id="textShadow" x="-10%" y="-30%" width="120%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <!-- cyan glow -->
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect x="30" y="20" width="940" height="240" rx="26"/></clipPath>
  </defs>

  <!-- banner card with drop shadow -->
  <rect x="30" y="20" width="940" height="240" rx="26" fill="url(#bg)" filter="url(#cardShadow)"/>

  <g clip-path="url(#card)">
    <!-- floating glow circles -->
    <circle cx="150" cy="80" r="70" fill="#22D3EE" opacity="0.12">
      <animate attributeName="cy" values="80;110;80" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="200" r="90" fill="#FFFFFF" opacity="0.07">
      <animate attributeName="cy" values="200;170;200" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="60" r="40" fill="#22D3EE" opacity="0.15">
      <animate attributeName="cx" values="700;740;700" dur="5s" repeatCount="indefinite"/>
    </circle>

    <!-- animated waves at the bottom -->
    <path fill="#0F172A" opacity="0.35" d="M0 220 Q 125 190 250 220 T 500 220 T 750 220 T 1000 220 T 1250 220 V 300 H 0 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0; -500 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path fill="#0F172A" opacity="0.5" d="M0 235 Q 125 210 250 235 T 500 235 T 750 235 T 1000 235 T 1250 235 V 300 H 0 Z">
      <animateTransform attributeName="transform" type="translate" values="-500 0; 0 0" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- title with shadow -->
  <g filter="url(#textShadow)">
    <text x="500" y="130" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="1">Muhammad Asad Akram</text>
  </g>

  <!-- animated underline -->
  <rect x="300" y="150" width="400" height="3" rx="2" fill="url(#line)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- subtitle -->
  <g filter="url(#textShadow)">
    <text x="500" y="192" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#E0F2FE">Salaam 👋  |  I teach machines to see, think &amp; act</text>
  </g>
</svg>
